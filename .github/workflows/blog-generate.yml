name: Generate blog post

on:
  schedule:
    # Twice daily: ~6am and ~3pm Pacific (13:07 / 22:07 UTC). The Sunday
    # SEO planner (blog-seo-review.yml) runs an hour earlier so the week's
    # plan exists before Sunday's first generation run. Off-the-hour
    # minutes avoid GitHub's top-of-hour cron congestion.
    - cron: "7 13 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic override (leave blank for auto-pick)"
        required: false
        default: ""
      format:
        description: "Optional format override (essay, listicle, news_commentary, question, myth_busting; blank for weighted auto-pick)"
        required: false
        default: ""
      draft:
        description: "Insert as draft instead of auto-publishing"
        required: false
        default: false
        type: boolean
      fast:
        description: "Use the streaming API instead of the Batch API (for one-offs someone is waiting on)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: blog-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Distill reviewer notes into standing guidance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 pipeline/update_guidance.py

      - name: Generate post and upload draft to Supabase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          args=()
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            args+=(--topic "${{ github.event.inputs.topic }}")
          fi
          if [ -n "${{ github.event.inputs.format }}" ]; then
            args+=(--format "${{ github.event.inputs.format }}")
          fi
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          if [ "${{ github.event.inputs.fast }}" = "true" ]; then
            args+=(--fast)
          fi
          python3 pipeline/generate_post.py "${args[@]}"
