name: Generate blog post

on:
  schedule:
    # Twice daily on weekdays: ~6am and ~3pm Pacific (13:07 / 22:07 UTC),
    # Monday-Friday. Weekends are off; Sunday runs the SEO planner instead
    # (blog-seo-review.yml). Off-the-hour minutes avoid GitHub's
    # top-of-hour cron congestion.
    - cron: "7 13 * * 1-5"
    - cron: "7 22 * * 1-5"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic override (leave blank for auto-pick)"
        required: false
        default: ""
      format:
        description: "Optional format override (essay, listicle, news_commentary, question, myth_busting; blank for weighted auto-pick)"
        required: false
        default: ""
      draft:
        description: "Insert as draft instead of auto-publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: blog-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Distill reviewer notes into standing guidance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 pipeline/update_guidance.py

      - name: Generate post and upload draft to Supabase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          args=()
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            args+=(--topic "${{ github.event.inputs.topic }}")
          fi
          if [ -n "${{ github.event.inputs.format }}" ]; then
            args+=(--format "${{ github.event.inputs.format }}")
          fi
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            args+=(--draft)
          fi
          python3 pipeline/generate_post.py "${args[@]}"
