name: Generate blog post

on:
  schedule:
    # Twice daily: ~6am and ~3pm Pacific (13:07 / 22:07 UTC).
    # Off-the-hour minutes avoid GitHub's top-of-hour cron congestion.
    - cron: "7 13 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic override (leave blank for auto-pick)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python3 pipeline/generate_post.py --topic "${{ github.event.inputs.topic }}"
          else
            python3 pipeline/generate_post.py
          fi

      - name: Build blog
        run: python3 pipeline/build_blog.py

      - name: Open pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          POST_FILE=$(git status --porcelain posts/ | awk '$1 == "??" {print $2}' | head -1)
          if [ -z "$POST_FILE" ]; then
            echo "No new post produced; nothing to do."
            exit 0
          fi

          SLUG=$(basename "$POST_FILE" .md)
          TITLE=$(python3 -c "
          import re, yaml, sys
          text = open('$POST_FILE').read()
          meta = yaml.safe_load(re.match(r'^---\n(.*?)\n---', text, re.S).group(1))
          print(meta['title'])")
          DESC=$(python3 -c "
          import re, yaml, sys
          text = open('$POST_FILE').read()
          meta = yaml.safe_load(re.match(r'^---\n(.*?)\n---', text, re.S).group(1))
          print(meta['description'])")

          BRANCH="blog/${SLUG}-$(date -u +%Y%m%d%H%M)"
          git config user.name "joice-blog-bot"
          git config user.email "blog-bot@joiceapp.com"
          git checkout -b "$BRANCH"
          git add posts/ blog/ sitemap.xml robots.txt llms.txt
          git commit -m "blog: ${TITLE}"
          git push origin "$BRANCH"

          gh pr create \
            --title "blog: ${TITLE}" \
            --body "$(cat <<EOF
          ## New blog post for review

          **${TITLE}**

          ${DESC}

          Preview the rendered page at \`blog/${SLUG}/index.html\` in this branch.
          Merging this PR publishes the post to joiceapp.com via Cloudflare Pages.

          ### Review checklist
          - [ ] Cited links actually support the claims made
          - [ ] Reads like a person wrote it (no AI tells)
          - [ ] Joice mention is tasteful (1-2 links, no hard sell)
          - [ ] Title and description are sensible for search

          🤖 Generated by the blog pipeline (\`pipeline/generate_post.py\`)
          EOF
          )"
