name: Process blog rewrites

on:
  schedule:
    # Hourly: pick up rewrite requests from joiceapp.com/review/.
    # Exits in seconds when the queue is empty.
    - cron: "37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blog-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Rewrite queued posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 pipeline/process_rewrites.py
