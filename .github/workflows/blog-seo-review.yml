name: Weekly SEO review

on:
  schedule:
    # Sundays ~5am Pacific (12:07 UTC during PDT), an hour before the
    # 13:07 generation run, so the planning doc is ready by ~6am and the
    # week's plan exists before Sunday's first post is generated.
    - cron: "7 12 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: blog-seo-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Review Search Console and plan the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python3 pipeline/seo_review.py
