<script>
const SUPABASE_URL = "https://hfcykydchzwfgotnztsb.supabase.co";
const SUPABASE_KEY = "sb_publishable_DWplZMwp3dt_50oX6aCoXA_fJ0H0rT2";

// ------------------------------------------------------------------ helpers

async function rpc(name, args) {
    const { data, error } = await sb.rpc(name, args || {});
    if (error) {
        if (error.code === "42501") throw new Error("this account isn't on the reviewer list");
        throw new Error(error.message || "request failed");
    }
    return data;
}

function toast(msg, isErr) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show" + (isErr ? " err" : "");
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ""; }, 2800);
}

function esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtDate(ts) {
    if (!ts) return "";
    return new Date(ts).toLocaleDateString("en-US",
        { month: "short", day: "numeric", year: "numeric" }).toLowerCase();
}

const STATUS_LABEL = {
    draft: "awaiting review",
    published: "published",
    rewrite_requested: "rewrite queued",
};

// tiny markdown renderer (matches the subset the site renders)
function inlineMd(t) {
    return t.replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" rel="noopener" target="_blank">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
}
// Line-based markdown renderer. Unlike a blank-line block splitter, this
// copes with model-written docs where a heading sits directly above a list,
// lists use single newlines, and # h1 appears.
function mdToHtml(md) {
    const out = [];
    let para = [], list = null, quote = [];
    const flushPara = () => {
        if (para.length) out.push(`<p>${inlineMd(esc(para.join(" ")))}</p>`);
        para = [];
    };
    const flushList = () => {
        if (list) out.push(`<${list.tag}>${list.items.map((i) =>
            `<li>${inlineMd(esc(i))}</li>`).join("")}</${list.tag}>`);
        list = null;
    };
    const flushQuote = () => {
        if (quote.length) out.push(`<blockquote><p>${inlineMd(esc(quote.join(" ")))}</p></blockquote>`);
        quote = [];
    };
    const flushAll = () => { flushPara(); flushList(); flushQuote(); };
    for (const raw of md.replace(/\r\n/g, "\n").split("\n")) {
        const line = raw.trim();
        let m;
        if (!line) { flushAll(); continue; }
        if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
            flushAll();
            const tag = m[1].length >= 3 ? "h3" : "h2"; // # and ## -> h2
            out.push(`<${tag}>${inlineMd(esc(m[2]))}</${tag}>`);
        } else if (/^(-{3,}|\*{3,})$/.test(line)) {
            flushAll(); out.push("<hr>");
        } else if ((m = line.match(/^>\s?(.*)$/))) {
            flushPara(); flushList(); quote.push(m[1]);
        } else if ((m = line.match(/^[-*]\s+(.*)$/))) {
            flushPara(); flushQuote();
            if (list && list.tag !== "ul") flushList();
            if (!list) list = { tag: "ul", items: [] };
            list.items.push(m[1]);
        } else if ((m = line.match(/^\d+\.\s+(.*)$/))) {
            flushPara(); flushQuote();
            if (list && list.tag !== "ol") flushList();
            if (!list) list = { tag: "ol", items: [] };
            list.items.push(m[1]);
        } else if (list) {
            // continuation of the previous list item (wrapped line)
            list.items[list.items.length - 1] += " " + line;
        } else {
            flushQuote(); para.push(line);
        }
    }
    flushAll();
    return out.join("\n");
}

// ------------------------------------------------------------------ sign in

function renderGate(message) {
    signoutBtn.style.display = "none";
    app.innerHTML = `
        <div class="rv-card">
            <h2>sign in</h2>
            <p class="rv-hint">${esc(message || "Reviewers only — sign in with an approved email.")}</p>
            <div class="rv-actions">
                <button class="rv-btn google block" id="google">
                    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Sign in with Google
                </button>
            </div>
            <div class="rv-divider">or use an email code</div>
            <label class="rv-label" for="gate-email">email</label>
            <input class="rv-input" id="gate-email" type="email" autocomplete="email"
                   placeholder="you@example.com" value="${esc(localStorage.getItem("rv_email") || "")}">
            <div id="code-row" style="display:none">
                <label class="rv-label" for="gate-code">6-digit code</label>
                <input class="rv-input" id="gate-code" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <div class="rv-actions">
                <button class="rv-btn primary block" id="gate-go">send code</button>
            </div>
        </div>`;

    document.getElementById("google").onclick = () => act(async () => {
        const { error } = await sb.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: location.origin + "/review/" },
        });
        if (error) throw new Error(error.message);
    });

    let codeSent = false;
    const go = document.getElementById("gate-go");
    go.onclick = () => act(async () => {
        const email = document.getElementById("gate-email").value.trim();
        if (!email) { toast("enter your email", true); return; }
        localStorage.setItem("rv_email", email);
        if (!codeSent) {
            const { error } = await sb.auth.signInWithOtp({ email });
            if (error) throw new Error(error.message);
            codeSent = true;
            document.getElementById("code-row").style.display = "";
            go.textContent = "verify code";
            toast("code sent — check your email");
        } else {
            const code = document.getElementById("gate-code").value.trim();
            const { error } = await sb.auth.verifyOtp({ email, token: code, type: "email" });
            if (error) throw new Error(error.message);
            await load();
        }
    });
}

// -------------------------------------------------------------------- lists

function renderList() {
    signoutBtn.style.display = "";
    current = null;
    const pending = posts.filter((p) => p.status !== "published");
    const published = posts.filter((p) => p.status === "published");

    const card = (p) => `
        <div class="rv-card tappable" data-id="${p.id}">
            <span class="rv-status ${p.status}">${STATUS_LABEL[p.status]}</span>
            <h2>${esc(p.title)}</h2>
            <div class="rv-desc">${esc(p.description)}</div>
            <div class="rv-meta">
                ${fmtDate(p.published_at || p.created_at)} &middot;
                ${(p.tags || []).join(", ")}
                ${p.review_notes ? ' &middot; <span class="rv-notes-flag">has notes</span>' : ""}
                ${p.pending_revision ? ' &middot; <span class="rv-notes-flag">revision ready</span>' : ""}
                ${p.revision_requested ? ' &middot; <span class="rv-notes-flag">revision queued</span>' : ""}
            </div>
        </div>`;

    const active = guidance.find((g) => g.is_active);
    app.innerHTML = `
        <div class="rv-section-label">
            <span>needs attention (${pending.length})</span>
            <span>
                <button class="rv-link" id="generate-now">&#10024; generate now</button> &nbsp;
                <button class="rv-link" id="open-seo">seo plan &rarr;</button> &nbsp;
                <button class="rv-link" id="open-guidance">writing guidance ${active ? "v" + active.version : ""} &rarr;</button>
            </span>
        </div>
        ${pending.map(card).join("") ||
          '<p class="rv-empty">nothing waiting — posts publish automatically on weekdays; drafts land here only when validation fails.</p>'}
        <div class="rv-section-label"><span>published (${published.length})</span></div>
        ${published.map(card).join("")}`;

    document.getElementById("open-guidance").onclick = () => renderGuidance();
    document.getElementById("open-seo").onclick = () => act(async () => {
        if (!seoReports) seoReports = await rpc("seo_report_list");
        renderSeo();
    });
    const genBtn = document.getElementById("generate-now");
    genBtn.onclick = () => act(async () => {
        if (!confirm("Generate a one-off post now? It researches, writes, and " +
                     "publishes automatically (~10-20 minutes).")) return;
        genBtn.disabled = true;
        try {
            const { data: { session } } = await sb.auth.getSession();
            const res = await fetch("/api/generate", {
                method: "POST",
                headers: { authorization: "Bearer " + (session?.access_token || "") },
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(body.error || "request failed (" + res.status + ")");
            toast("generation started — the post will appear here in ~10-20 min");
        } finally {
            genBtn.disabled = false;
        }
    });
    app.querySelectorAll(".rv-card.tappable").forEach((el) => {
        el.onclick = () => {
            current = posts.find((p) => p.id === el.dataset.id);
            renderDetail();
            window.scrollTo(0, 0);
        };
    });
}

// ----------------------------------------------------------------- guidance

function renderGuidance() {
    const active = guidance.find((g) => g.is_active);
    app.innerHTML = `
        <button class="rv-back" id="back">&larr; all posts</button>
        <div class="rv-card">
            <span class="rv-status ${active ? "active" : "old"}">${active ? "active — v" + active.version : "no guidance yet"}</span>
            <h2>standing writing guidance</h2>
            <p class="rv-hint">Distilled from your notes after each pipeline run and injected
            into every writing prompt permanently. Edit it directly (saves as a new version)
            or revert to any older version below.</p>
            <label class="rv-label" for="g-content">guidance</label>
            <textarea class="rv-textarea" id="g-content" rows="12"
                placeholder="no guidance yet — save notes on posts and the next pipeline run will distill them, or write guidance here directly.">${esc(active ? active.content : "")}</textarea>
            <div class="rv-actions">
                <button class="rv-btn primary" id="g-save">save as new version</button>
            </div>
        </div>
        <div class="rv-section-label"><span>version history</span></div>
        ${guidance.map((g) => `
            <div class="rv-card">
                <span class="rv-status ${g.is_active ? "active" : "old"}">v${g.version}${g.is_active ? " — active" : ""}</span>
                <div class="rv-meta">${fmtDate(g.created_at)} &middot; ${esc(g.created_by)}</div>
                <div class="rv-desc" style="margin-top:8px">${esc(g.rationale || "")}</div>
                <details style="margin-top:10px"><summary class="rv-hint" style="cursor:pointer">show content</summary>
                    <div class="rv-guidance-content">${esc(g.content)}</div>
                </details>
                ${g.is_active ? "" : `<div class="rv-actions"><button class="rv-btn ghost" data-activate="${g.id}">revert to this version</button></div>`}
            </div>`).join("") ||
          '<p class="rv-empty">no versions yet.</p>'}`;

    document.getElementById("back").onclick = () => renderList();

    document.getElementById("g-save").onclick = () => act(async () => {
        const content = document.getElementById("g-content").value.trim();
        if (!content) { toast("guidance is empty", true); return; }
        const row = await rpc("guidance_create", { p_content: content, p_rationale: "manual edit from review console" });
        guidance = await rpc("guidance_list");
        toast("saved as v" + row.version);
        renderGuidance();
    });

    app.querySelectorAll("[data-activate]").forEach((btn) => {
        btn.onclick = () => act(async () => {
            const row = await rpc("guidance_activate", { p_id: btn.dataset.activate });
            guidance = await rpc("guidance_list");
            toast("reverted to v" + row.version);
            renderGuidance();
        });
    });
}

// --------------------------------------------------------------------- seo

function renderSeo() {
    const activeReport = (seoReports || []).find((r) => r.status === "active");
    const past = (seoReports || []).filter((r) => r !== activeReport);
    const STATE_BADGE = {
        done: '<span class="rv-plan-state done" title="written">&#10003;</span>',
        skipped: '<span class="rv-plan-state skipped" title="skipped">&#10007;</span>',
        pending: '<span class="rv-plan-state" title="pending">&#9711;</span>',
    };
    const planBits = (r) => {
        const topics = (r.plan?.topics || []).map((t) => `
            <div class="rv-plan-item">
                <div class="rv-plan-head">
                    ${STATE_BADGE[t.state] || STATE_BADGE.pending}
                    <span class="rv-plan-topic">${esc(t.topic)}</span>
                    <span class="rv-plan-pill">${esc(t.format || "")}</span>
                </div>
                ${(t.target_queries || []).length
                    ? `<div class="rv-plan-queries">${t.target_queries.map((q) =>
                        `<span class="rv-plan-query">${esc(q)}</span>`).join("")}</div>` : ""}
                <div class="rv-plan-why">${esc(t.rationale)}</div>
            </div>`).join("");
        const opts = (r.plan?.optimizations || []).map((o) => `
            <div class="rv-plan-item">
                <div class="rv-plan-head">
                    <span class="rv-plan-state edit">&#9998;</span>
                    <a class="rv-plan-topic" href="/blog/${esc(o.slug)}/" target="_blank" rel="noopener">${esc(o.slug)}</a>
                </div>
                <div class="rv-plan-why">${esc(o.diagnosis)}</div>
                ${(o.actions || []).length
                    ? `<ul class="rv-plan-actions">${o.actions.map((a) =>
                        `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
            </div>`).join("");
        return (topics ? `<div class="rv-plan-group">new posts this week</div>${topics}` : "")
             + (opts ? `<div class="rv-plan-group">optimize existing posts</div>${opts}` : "");
    };
    app.innerHTML = `
        <button class="rv-back" id="back">&larr; all posts</button>
        ${activeReport ? `
        <div class="rv-card">
            <span class="rv-status active">this week — ${fmtDate(activeReport.created_at)}</span>
            <h2>weekly seo plan</h2>
            ${planBits(activeReport)}
            <details style="margin-top:12px" open><summary class="rv-hint" style="cursor:pointer">planning doc</summary>
                <div class="rv-preview rv-plandoc">${mdToHtml(activeReport.plan_doc || "")}</div>
            </details>
        </div>` : '<p class="rv-empty">no seo report yet — the planner runs sunday mornings.</p>'}
        <div class="rv-section-label"><span>past weeks</span></div>
        ${past.map((r) => `
            <div class="rv-card">
                <span class="rv-status old">${fmtDate(r.created_at)}</span>
                ${planBits(r)}
                <details style="margin-top:10px"><summary class="rv-hint" style="cursor:pointer">planning doc</summary>
                    <div class="rv-preview rv-plandoc">${mdToHtml(r.plan_doc || "")}</div>
                </details>
            </div>`).join("") || '<p class="rv-empty">no history yet.</p>'}`;
    document.getElementById("back").onclick = () => renderList();
}

// ------------------------------------------------------------------- detail

function renderDetail() {
    const p = current;
    const isPublished = p.status === "published";
    app.innerHTML = `
        <button class="rv-back" id="back">&larr; all posts</button>
        <div class="rv-card">
            <span class="rv-status ${p.status}">${STATUS_LABEL[p.status]}</span>
            <div class="rv-meta">/blog/${esc(p.slug)}/ &middot; ${(p.body_md.match(/\w+/g) || []).length} words</div>
            ${p.topic_rationale ? `
            <div class="rv-impetus"><strong>why this post exists:</strong> ${esc(p.topic_rationale)}</div>` : ""}

            <label class="rv-label" for="f-title">title</label>
            <input class="rv-input" id="f-title" value="${esc(p.title)}">

            <label class="rv-label" for="f-desc">description</label>
            <textarea class="rv-textarea" id="f-desc" rows="3">${esc(p.description)}</textarea>

            <label class="rv-label" for="f-body">essay (markdown) &middot;
                <a href="#" id="toggle-preview" style="color:var(--fern)">preview</a></label>
            <textarea class="rv-textarea rv-body" id="f-body">${esc(p.body_md)}</textarea>
            <div class="rv-preview" id="preview" style="display:none"></div>

            <div class="rv-actions">
                <button class="rv-btn ghost" id="save-edits">save edits</button>
                ${isPublished
                    ? '<button class="rv-btn danger" id="unpublish">unpublish</button>'
                    : '<button class="rv-btn primary" id="approve">approve &amp; publish</button>'}
            </div>
        </div>

        ${p.pending_revision ? `
        <div class="rv-card">
            <span class="rv-status rewrite_requested">revision ready</span>
            <h2>pending revision</h2>
            <p class="rv-hint">${esc(p.pending_revision.notes || "")}</p>
            <div class="rv-meta" style="margin-top:8px">
                new title: ${esc(p.pending_revision.title)}<br>
                ${(p.pending_revision.body_markdown || "").match(/\w+/g)?.length || 0} words
                (live: ${(p.body_md.match(/\w+/g) || []).length})
            </div>
            <details style="margin-top:10px"><summary class="rv-hint" style="cursor:pointer">preview revision</summary>
                <div class="rv-preview" id="rev-preview"></div>
            </details>
            <div class="rv-actions">
                <button class="rv-btn primary" id="apply-revision">apply revision</button>
                <button class="rv-btn danger" id="discard-revision">discard</button>
            </div>
            <p class="rv-hint">The live post is untouched until you apply. Applying keeps
            the slug, so the URL never changes.</p>
        </div>` : ""}

        <div class="rv-card">
            <label class="rv-label" for="f-notes" style="margin-top:0">your notes</label>
            <textarea class="rv-textarea" id="f-notes" rows="5"
                placeholder="what should be different? these notes steer the rewrite of this post and are distilled into the standing writing guidance.">${esc(p.review_notes || "")}</textarea>
            <div class="rv-actions">
                <button class="rv-btn ghost" id="save-notes">save notes</button>
                ${p.status === "rewrite_requested"
                    ? '<button class="rv-btn danger" id="cancel-rewrite">cancel rewrite</button>'
                    : p.revision_requested
                    ? '<button class="rv-btn danger" id="cancel-revision">cancel queued revision</button>'
                    : '<button class="rv-btn warn" id="request-rewrite">request rewrite</button>'}
            </div>
            <p class="rv-hint">${isPublished
                ? "Rewrites of published posts run about once an hour and come back here as a pending revision — the post stays live the whole time. Notes are also distilled into the standing writing guidance."
                : "Rewrites run automatically about once an hour against your notes and return here as a fresh draft. Notes are also distilled into the standing writing guidance for all future posts."}</p>
        </div>`;

    document.getElementById("back").onclick = () => renderList();

    document.getElementById("toggle-preview").onclick = (e) => {
        e.preventDefault();
        const pv = document.getElementById("preview");
        const body = document.getElementById("f-body");
        const showing = pv.style.display !== "none";
        pv.style.display = showing ? "none" : "";
        body.style.display = showing ? "" : "none";
        e.target.textContent = showing ? "preview" : "edit";
        if (!showing) pv.innerHTML = mdToHtml(body.value);
    };

    document.getElementById("save-edits").onclick = () => act(async () => {
        merge(await rpc("review_update", {
            p_id: p.id,
            p_title: document.getElementById("f-title").value.trim(),
            p_description: document.getElementById("f-desc").value.trim(),
            p_body_md: document.getElementById("f-body").value,
        }));
        toast("edits saved");
    });

    document.getElementById("save-notes").onclick = () => act(async () => {
        merge(await rpc("review_save_notes", {
            p_id: p.id, p_notes: document.getElementById("f-notes").value,
        }));
        toast("notes saved");
    });

    const approve = document.getElementById("approve");
    if (approve) approve.onclick = () => act(async () => {
        merge(await rpc("review_set_status", { p_id: p.id, p_status: "published" }));
        toast("published — live in ~5 minutes");
        renderList();
    });

    const unpublish = document.getElementById("unpublish");
    if (unpublish) unpublish.onclick = () => act(async () => {
        merge(await rpc("review_set_status", { p_id: p.id, p_status: "draft" }));
        toast("unpublished");
        renderList();
    });

    const rewrite = document.getElementById("request-rewrite");
    if (rewrite) rewrite.onclick = () => act(async () => {
        const notes = document.getElementById("f-notes").value.trim();
        if (!notes) { toast("add notes first — they drive the rewrite", true); return; }
        if (isPublished) {
            // Live posts stay live: queue a targeted revision instead of
            // pulling the post back to draft.
            merge(await rpc("review_request_revision", { p_id: p.id, p_notes: notes }));
            toast("revision queued — post stays live; runs within the hour");
        } else {
            await rpc("review_save_notes", { p_id: p.id, p_notes: notes });
            merge(await rpc("review_set_status", { p_id: p.id, p_status: "rewrite_requested" }));
            toast("rewrite queued — runs within the hour");
        }
        renderList();
    });

    const revPreview = document.getElementById("rev-preview");
    if (revPreview && p.pending_revision)
        revPreview.innerHTML = mdToHtml(p.pending_revision.body_markdown || "");

    const applyRev = document.getElementById("apply-revision");
    if (applyRev) applyRev.onclick = () => act(async () => {
        merge(await rpc("review_apply_revision", { p_id: p.id }));
        toast("revision applied — live in ~5 minutes");
        renderDetail();
    });

    const discardRev = document.getElementById("discard-revision");
    if (discardRev) discardRev.onclick = () => act(async () => {
        merge(await rpc("review_discard_revision", { p_id: p.id }));
        toast("revision discarded");
        renderDetail();
    });

    const cancelRev = document.getElementById("cancel-revision");
    if (cancelRev) cancelRev.onclick = () => act(async () => {
        merge(await rpc("review_discard_revision", { p_id: p.id }));
        toast("queued revision cancelled");
        renderDetail();
    });

    const cancel = document.getElementById("cancel-rewrite");
    if (cancel) cancel.onclick = () => act(async () => {
        merge(await rpc("review_set_status", { p_id: p.id, p_status: "draft" }));
        toast("rewrite cancelled");
        renderDetail();
    });
}

function merge(updated) {
    const i = posts.findIndex((x) => x.id === updated.id);
    if (i >= 0) posts[i] = updated;
    if (current && current.id === updated.id) current = updated;
}

async function act(fn) {
    try { await fn(); }
    catch (e) { toast(e.message, true); }
}

// -------------------------------------------------------------------- boot

async function load() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { renderGate(); return; }
    app.innerHTML = '<div class="rv-spin">loading&hellip;</div>';
    try {
        [posts, guidance] = await Promise.all([rpc("review_list"), rpc("guidance_list")]);
        renderList();
    } catch (e) {
        if (e.message.includes("reviewer list")) {
            await sb.auth.signOut();
            renderGate("That account isn't on the reviewer list.");
        } else {
            app.innerHTML = `<p class="rv-empty">${esc(e.message)}</p>`;
        }
    }
}

signoutBtn.onclick = async () => {
    await sb.auth.signOut();
    renderGate();
};

// completes the OAuth redirect (supabase-js parses the URL hash), then loads
sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_IN") load();
});

load();
</script>

</html>
